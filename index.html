<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine's Proposal</title>
  <style>
    body {
      background: #ffebef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    /* Floating hearts background */
    .floating-heart {
      position: absolute;
      font-size: 1.5em;
      color: red;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0.7; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .heart {
      width: 100px;
      height: 90px;
      position: relative;
      transform: rotate(-45deg);
      animation: pulse 1s infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 100px;
      height: 90px;
      border-radius: 50%;
      background: red;
      position: absolute;
    }

    .heart::before { top: -50px; left: 0; }
    .heart::after { left: 50px; top: 0; }

    @keyframes pulse {
      0% { transform: scale(1) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(-45deg); }
      100% { transform: scale(1) rotate(-45deg); }
    }

    h1 {
      margin-top: 30px;
      color: #d10000;
      font-size: 2em;
      text-align: center;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff4d4d; }
      to { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff4d4d; }
    }

    .buttons { margin-top: 20px; }

    button {
      margin: 0 10px;
      padding: 10px 20px;
      font-size: 1.2em;
      background: #d10000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
    }

    button:hover {
      background: #a00000;
      transform: scale(1.1);
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    .broken-heart {
      font-size: 4em;
      color: #555;
      margin-top: 20px;
      animation: crack 1s forwards;
    }

    @keyframes crack {
      0% { transform: scale(1); }
      50% { transform: rotate(-10deg) scale(1.1); }
      100% { transform: rotate(10deg) scale(0.8); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- Background Music -->
  <audio autoplay loop>
    <source src="romantic.mp3" type="audio/mpeg">
  </audio>

  <!-- Floating hearts -->
  <div class="floating-heart" style="left:20%; animation-delay:0s;">❤️</div>
  <div class="floating-heart" style="left:50%; animation-delay:2s;">💖</div>
  <div class="floating-heart" style="left:70%; animation-delay:4s;">💕</div>

  <div class="heart"></div>
  <h1>Will you be my Valentine? ❤️</h1>
  <div class="buttons">
    <button onclick="launchConfetti()">Yes!</button>
    <button onclick="brokenHeart()">No...</button>
  </div>

  <div id="response"></div>

  <script>
    function launchConfetti() {
      for (let i = 0; i < 50; i++) {
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");
        document.body.appendChild(confetti);

        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.background = ["red","pink","hotpink","deeppink"][Math.floor(Math.random()*4)];

        let size = Math.random() * 12 + 8;
        confetti.style.width = size + "px";
        confetti.style.height = size + "px";

        confetti.style.animationDelay = Math.random() * 2 + "s";
        setTimeout(() => { confetti.remove(); }, 3000);
      }
      alert("Yay! ❤️ You said YES!");
    }

    function brokenHeart() {
      let responseDiv = document.getElementById("response");
      responseDiv.innerHTML = "<div class='broken-heart'>💔</div><p style='color:#555;font-size:1.2em;'>Oh no... my heart is broken!</p>";
    }
  </script>
</body>
</html>
