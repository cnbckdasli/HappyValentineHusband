<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine's Proposal</title>
  <style>
    body {
      background: #ffebef;
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Floating hearts background */
    .floating-heart {
      position: absolute;
      font-size: 1.5em;
      color: red;
      animation: floatUp 8s linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0.7; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Central pulsing heart */
    .heart {
      width: 100px;
      height: 90px;
      position: relative;
      transform: rotate(-45deg);
      animation: pulse 1s infinite;
    }
    .heart::before,
    .heart::after {
      content: "";
      width: 100px;
      height: 90px;
      border-radius: 50%;
      background: red;
      position: absolute;
    }
    .heart::before { top: -50px; left: 0; }
    .heart::after { left: 50px; top: 0; }
    @keyframes pulse {
      0% { transform: scale(1) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(-45deg); }
      100% { transform: scale(1) rotate(-45deg); }
    }

    /* Proposal text typing + glow */
    h1 {
      margin-top: 30px;
      color: #d10000;
      font-size: 2em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #d10000;
      width: 0;
      animation: typing 4s steps(30, end) forwards, glow 2s ease-in-out infinite alternate;
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ff4d4d; }
      to { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff4d4d; }
    }

    /* Buttons */
    .buttons { margin-top: 20px; }
    button {
      margin: 0 10px;
      padding: 10px 20px;
      font-size: 1.2em;
      background: #d10000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
    }
    button:hover { background: #a00000; transform: scale(1.1); }

    /* Fireworks sparks */
    .spark {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Music control */
    #musicControl {
      margin-top: 20px;
      font-size: 1em;
      background: #ff4d4d;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Background Music -->
  /*<audio id="bgMusic" autoplay loop>
    <source src="romantic.mp3" type="audio/mpeg">
  </audio>*/

  <!-- Floating hearts -->
  <div class="floating-heart" style="left:20%; animation-delay:0s;">❤️</div>
  <div class="floating-heart" style="left:50%; animation-delay:2s;">💖</div>
  <div class="floating-heart" style="left:70%; animation-delay:4s;">💕</div>
  <div class="floating-heart" style="left:30%; animation-delay:6s;">💞</div>

  <!-- Central heart + text -->
  <div class="heart"></div>
  <h1>Will you be my Valentine? ❤️</h1>

  <!-- Buttons -->
  <div class="buttons">
    <button onclick="launchFireworks()">Yes!</button>
    <button id="noBtn">No...</button>
  </div>

  <!-- Music control -->
  /*<button id="musicControl">Pause Music 🎶</button>*/

  <script>
    // Fireworks effect
    function launchFireworks() {
      for (let i = 0; i < 30; i++) {
        let spark = document.createElement("div");
        spark.classList.add("spark");
        spark.style.background = ["red","pink","gold","purple"][Math.floor(Math.random()*4)];
        spark.style.left = window.innerWidth/2 + "px";
        spark.style.top = window.innerHeight/2 + "px";
        document.body.appendChild(spark);

        let x = (Math.random() - 0.5) * 400;
        let y = (Math.random() - 0.5) * 400;
        spark.animate([
          { transform: "translate(0,0)", opacity: 1 },
          { transform: `translate(${x}px, ${y}px)`, opacity: 0 }
        ], { duration: 1500, easing: "ease-out" });

        setTimeout(() => spark.remove(), 1500);
      }
      alert("Yay! ❤️ You said YES!");
    }

    // No button runs away
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.position = "absolute";
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
    });

    // Music control
    /*const bgMusic = document.getElementById("bgMusic");
    const musicControl = document.getElementById("musicControl");
    musicControl.addEventListener("click", () => {
      if (bgMusic.paused) {
        bgMusic.play();
        musicControl.textContent = "Pause Music 🎶";
      } else {
        bgMusic.pause();
        musicControl.textContent = "Play Music 🎶";
      }
    });*/
  </script>
</body>
</html>
